services:
  # Development services
  postgres:
    image: pgvector/pgvector:pg16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mess_manager_server
      POSTGRES_PASSWORD: "bPsqijedzNmKv8hIdq1N60yjMsxsA5ng"
    volumes:
      - mess_manager_server_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "EI7ZqjJgQCj5nxU7pVGETj0uRUfSLF_v"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: pgvector/pgvector:pg16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: mess_manager_server_test
      POSTGRES_PASSWORD: "drFuXnmLvPlxufmgef-YZgIE1rIkuAug"
    volumes:
      - mess_manager_server_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "eXrLFwWxW9vevfmPbJecpYV076xUoqEf"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  mess_manager_server_data:
  mess_manager_server_test_data:
